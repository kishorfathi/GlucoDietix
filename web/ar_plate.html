<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlucoDietix AR Plate</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: rgba(9, 16, 28, 0.82);
      --panel-border: rgba(151, 176, 214, 0.35);
      --text: #f2f7ff;
      --muted: #b6c4db;
      --accent: #28b8ff;
      --rice: #ffd166;
      --vegetable: #41c97a;
      --protein: #ff6b6b;
      --dhal: #ff9f43;
      --other: #89a4c2;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.4) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.25), transparent 28%, rgba(0, 0, 0, 0.45));
      pointer-events: none;
    }

    #plate {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(68vw, 340px);
      height: min(68vw, 340px);
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.55));
    }

    #topCard, #bottomCard {
      position: absolute;
      left: 12px;
      right: 12px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      border-radius: 14px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #topCard {
      top: 12px;
      padding: 10px 12px;
    }

    #title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    #subtitle {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    #bottomCard {
      bottom: 12px;
      padding: 10px 12px;
      max-height: 42vh;
      overflow: auto;
    }

    #items {
      display: grid;
      gap: 8px;
    }

    .item {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(153, 176, 214, 0.28);
      background: rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }

    .itemHead {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .deltaGood {
      color: #6bffb8;
    }

    .deltaWarn {
      color: #ffd074;
    }

    .deltaBad {
      color: #ff9191;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(170, 191, 227, 0.38);
      background: rgba(7, 15, 28, 0.78);
      color: #dce9ff;
      max-width: calc(100vw - 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #legend {
      margin-top: 6px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .item.interactive {
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(153, 176, 214, 0.4);
    }

    .item.interactive:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent);
      transform: translateX(2px);
    }

    .item.interactive.hidden {
      opacity: 0.4;
      text-decoration: line-through;
    }

    .item.expanded {
      background: rgba(40, 184, 255, 0.1);
      border-color: var(--accent);
    }

    .itemDetails {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(153, 176, 214, 0.2);
      font-size: 11px;
      color: var(--muted);
    }

    .itemDetails.show {
      display: block;
    }

    .nutritionRow {
      display: flex;
      justify-content: space-between;
      margin: 3px 0;
    }

    .portionSlider {
      margin-top: 6px;
      width: 100%;
    }

    .portionSlider input {
      width: 100%;
      height: 4px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .controlBtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: rgba(40, 184, 255, 0.15);
      color: var(--accent);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .controlBtn:hover {
      background: rgba(40, 184, 255, 0.25);
      transform: scale(1.05);
    }

    .controlBtn:active {
      transform: scale(0.95);
    }

    #plateRotation {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 5;
    }

    .summary {
      padding: 8px 10px;
      background: rgba(40, 184, 255, 0.08);
      border: 1px solid rgba(40, 184, 255, 0.3);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }

    .summaryRow {
      display: flex;
      justify-content: space-between;
      margin: 2px 0;
    }

    .tooltipIcon {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-left: 4px;
      color: var(--accent);
      cursor: help;
    }

    #touchHint {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      pointer-events: none;
      animation: fadeInOut 3s infinite;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="plate" width="500" height="500"></canvas>
    <div id="vignette"></div>

    <div id="status">Starting camera...</div>
    <div id="plateRotation">Drag to rotate</div>
    <div id="touchHint">Tap items to see details</div>

    <div id="topCard">
      <div id="title">AR Plate Portion Guide</div>
      <div id="subtitle">Diabetes-focused visual portion reference. No marker required.</div>
      <div id="legend">
        <span><span class="dot" style="background: var(--rice);"></span>Rice</span>
        <span><span class="dot" style="background: var(--vegetable);"></span>Vegetable</span>
        <span><span class="dot" style="background: var(--protein);"></span>Protein</span>
        <span><span class="dot" style="background: var(--dhal);"></span>Dhal</span>
      </div>
    </div>

    <div id="bottomCard">
      <div id="summary" class="summary"></div>
      <div id="items"></div>
    </div>

    <div class="controls">
      <button class="controlBtn" id="btnReset" title="Reset portions to recommended">↻</button>
      <button class="controlBtn" id="btnToggle" title="Hide/show all items">◉</button>
    </div>
  </div>

  <script>
    // Global state
    let gState = {
      items: [],
      segments: [],
      itemGrams: {},
      itemHidden: {},
      expandedItem: null,
      plateRotation: 0,
      isDragging: false,
      dragStartX: 0,
    };

    function parsePayload() {
      try {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('data');
        if (!raw) return { items: [], segments: [] };
        const decoded = decodeURIComponent(raw);
        const data = JSON.parse(decoded);
        return {
          items: Array.isArray(data.items) ? data.items : [],
          segments: Array.isArray(data.segments) ? data.segments : []
        };
      } catch (error) {
        return { items: [], segments: [] };
      }
    }

    function categoryColor(cat) {
      const normalized = String(cat || '').toLowerCase();
      if (normalized.includes('rice')) return getComputedStyle(document.documentElement).getPropertyValue('--rice').trim();
      if (normalized.includes('vegetable')) return getComputedStyle(document.documentElement).getPropertyValue('--vegetable').trim();
      if (normalized.includes('protein')) return getComputedStyle(document.documentElement).getPropertyValue('--protein').trim();
      if (normalized.includes('dhal')) return getComputedStyle(document.documentElement).getPropertyValue('--dhal').trim();
      return getComputedStyle(document.documentElement).getPropertyValue('--other').trim();
    }

    function setStatus(text) {
      const status = document.getElementById('status');
      if (status) status.textContent = text;
    }

    function getActiveItems() {
      return gState.items.filter((item, idx) => !gState.itemHidden[idx]);
    }

    function getActiveSegments() {
      const active = getActiveItems();
      return gState.segments.filter((seg) => {
        const foodCount = active.filter((item) => 
          String(item.category || '').toLowerCase().includes(String(seg.category || '').toLowerCase())
        ).length;
        return foodCount > 0;
      });
    }

    function drawPlate(segments) {
      const canvas = document.getElementById('plate');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const drawSegments = (Array.isArray(segments) && segments.length > 0)
        ? segments
        : [
            { category: 'vegetable', portionCount: 2 },
            { category: 'protein', portionCount: 1 },
            { category: 'rice', portionCount: 1 },
          ];

      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) * 0.42;
      const ringWidth = radius * 0.52;

      ctx.clearRect(0, 0, width, height);

      // Apply rotation
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((gState.plateRotation * Math.PI) / 180);
      ctx.translate(-cx, -cy);

      const PLATE_UNITS = 4;
      let usedUnits = 0;

      // Draw base track
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.arc(cx, cy, radius - ringWidth, Math.PI * 2, 0, true);
      ctx.closePath();
      ctx.fillStyle = 'rgba(130, 155, 195, 0.20)';
      ctx.fill();

      let start = -Math.PI / 2;
      drawSegments.forEach((segment) => {
        const value = Math.max(0, Number(segment.portionCount) || 0);
        if (value <= 0) return;

        const remainingUnits = Math.max(0, PLATE_UNITS - usedUnits);
        const clampedValue = Math.min(value, remainingUnits);
        if (clampedValue <= 0) return;

        const angle = (clampedValue / PLATE_UNITS) * Math.PI * 2;
        const end = start + angle;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, start, end);
        ctx.arc(cx, cy, radius - ringWidth, end, start, true);
        ctx.closePath();
        ctx.fillStyle = categoryColor(segment.category);
        ctx.globalAlpha = 0.9;
        ctx.fill();
        ctx.globalAlpha = 1;

        start = end;
        usedUnits += clampedValue;
      });

      ctx.beginPath();
      ctx.arc(cx, cy, radius + 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(230, 241, 255, 0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, radius - ringWidth - 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(230, 241, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = 'rgba(5, 12, 23, 0.78)';
      ctx.beginPath();
      ctx.arc(cx, cy, radius - ringWidth - 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#eaf2ff';
      ctx.font = '600 24px Segoe UI, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Plate', cx, cy - 6);
      ctx.font = '500 15px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = '#b5c8e8';
      ctx.fillText('portion guide', cx, cy + 20);

      ctx.restore();
    }

    function updateSummary() {
      const active = getActiveItems();
      const totalGrams = active.reduce((sum, item, idx) => {
        if (!gState.itemHidden[idx]) {
          return sum + (gState.itemGrams[idx] || item.grams || 0);
        }
        return sum;
      }, 0);
      const totalRecommended = active.reduce((sum, item) => sum + (item.recommended || 0), 0);

      const summary = document.getElementById('summary');
      const ratio = totalRecommended > 0 ? totalGrams / totalRecommended : 1;
      const ratio100 = Math.round(ratio * 100);
      const ratioColor = ratio <= 1.1 ? '#6bffb8' : ratio <= 1.3 ? '#ffd074' : '#ff9191';

      summary.innerHTML = `
        <div class="summaryRow">
          <span>Total: ${totalGrams.toFixed(0)}g / ${totalRecommended.toFixed(0)}g</span>
          <span style="color: ${ratioColor}; font-weight: 600;">${ratio100}%</span>
        </div>
      `;
    }

    function renderItems(items) {
      const root = document.getElementById('items');
      root.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'item';
        empty.textContent = 'No foods selected yet.';
        root.appendChild(empty);
        return;
      }

      items.forEach((item, idx) => {
        const grams = gState.itemGrams[idx] !== undefined ? gState.itemGrams[idx] : item.grams;
        const recommended = item.recommended || 0;
        const diff = grams - recommended;
        const ratio = recommended > 0 ? grams / recommended : 1;
        const ratioPercent = Math.round(ratio * 100);
        const deltaClass = ratio <= 1.1 ? 'deltaGood' : ratio <= 1.3 ? 'deltaWarn' : 'deltaBad';
        const diffLabel = diff >= 0 ? `+${diff.toFixed(0)} g` : `${diff.toFixed(0)} g`;
        const isHidden = gState.itemHidden[idx];
        const isExpanded = gState.expandedItem === idx;

        const node = document.createElement('div');
        node.className = `item interactive ${isHidden ? 'hidden' : ''} ${isExpanded ? 'expanded' : ''}`;
        node.dataset.index = idx;

        const head = document.createElement('div');
        head.className = 'itemHead';
        head.innerHTML = `
          <span>${item.name || 'Food item'}</span>
          <span class="${deltaClass}">${diffLabel}</span>
        `;

        const main = document.createElement('div');
        main.textContent = `Current: ${grams.toFixed(0)} g | Recommended: ${recommended.toFixed(0)} g`;

        node.appendChild(head);
        node.appendChild(main);

        // Expandable details
        const details = document.createElement('div');
        details.className = `itemDetails ${isExpanded ? 'show' : ''}`;
        details.innerHTML = `
          <div class="nutritionRow">
            <span>Status:</span>
            <span class="${deltaClass}">${ratioPercent}% of recommended</span>
          </div>
          <div class="nutritionRow">
            <span>Adjust portion:</span>
          </div>
          <div class="portionSlider">
            <input type="range" min="0" max="${recommended * 2}" step="5" value="${grams}" class="gramSlider">
          </div>
        `;

        node.appendChild(details);

        // Click to toggle expand
        head.style.cursor = 'pointer';
        head.addEventListener('click', (e) => {
          e.stopPropagation();
          gState.expandedItem = gState.expandedItem === idx ? null : idx;
          renderItems(items);
        });

        // Toggle hidden on long click or double click
        node.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          gState.itemHidden[idx] = !gState.itemHidden[idx];
          const segments = getActiveSegments();
          renderItems(items);
          drawPlate(segments);
          updateSummary();
        });

        // Slider for gram adjustment
        const slider = node.querySelector('.gramSlider');
        if (slider) {
          slider.addEventListener('input', (e) => {
            gState.itemGrams[idx] = Number(e.target.value);
            const segments = getActiveSegments();
            renderItems(items);
            drawPlate(segments);
            updateSummary();
          });
        }

        root.appendChild(node);
      });

      updateSummary();
    }

    function handlePlateClick(e) {
      const canvas = document.getElementById('plate');
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Detect if click is near the plate area
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const clickDist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
      const ringStart = rect.width * 0.21;
      const ringEnd = rect.width * 0.42;

      if (clickDist >= ringStart && clickDist <= ringEnd) {
        // Click on plate - could rotate or show tooltip
        setStatus('Drag the plate to rotate it');
      }
    }

    function setupDragRotation() {
      const canvas = document.getElementById('plate');

      canvas.addEventListener('mousedown', (e) => {
        gState.isDragging = true;
        gState.dragStartX = e.clientX;
      });

      document.addEventListener('mousemove', (e) => {
        if (gState.isDragging) {
          const delta = e.clientX - gState.dragStartX;
          gState.plateRotation += delta * 0.5;
          gState.dragStartX = e.clientX;

          const segments = getActiveSegments();
          drawPlate(segments);
        }
      });

      document.addEventListener('mouseup', () => {
        gState.isDragging = false;
      });

      // Touch support for mobile
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          gState.isDragging = true;
          gState.dragStartX = e.touches[0].clientX;
        }
      });

      document.addEventListener('touchmove', (e) => {
        if (gState.isDragging && e.touches.length === 1) {
          const delta = e.touches[0].clientX - gState.dragStartX;
          gState.plateRotation += delta * 0.5;
          gState.dragStartX = e.touches[0].clientX;

          const segments = getActiveSegments();
          drawPlate(segments);
        }
      });

      document.addEventListener('touchend', () => {
        gState.isDragging = false;
      });
    }

    function setupControls() {
      const btnReset = document.getElementById('btnReset');
      const btnToggle = document.getElementById('btnToggle');

      if (btnReset) {
        btnReset.addEventListener('click', () => {
          gState.itemGrams = {};
          gState.itemHidden = {};
          gState.expandedItem = null;
          const segments = getActiveSegments();
          renderItems(gState.items);
          drawPlate(segments);
          setStatus('Reset to recommended portions');
        });
      }

      if (btnToggle) {
        btnToggle.addEventListener('click', () => {
          const allHidden = gState.items.every((_, idx) => gState.itemHidden[idx]);
          gState.items.forEach((_, idx) => {
            gState.itemHidden[idx] = !allHidden;
          });
          const segments = getActiveSegments();
          renderItems(gState.items);
          drawPlate(segments);
          setStatus(allHidden ? 'All items visible' : 'All items hidden');
        });
      }
    }

    async function startCamera() {
      const video = document.getElementById('camera');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Camera API is not available in this browser.');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        setStatus('Camera active. Align your plate with the overlay.');

        window.addEventListener('beforeunload', () => {
          stream.getTracks().forEach((track) => track.stop());
        });
      } catch (error) {
        setStatus('Camera access denied. Allow camera permission for AR Plate.');
      }
    }

    (function init() {
      const data = parsePayload();
      gState.items = data.items;
      gState.segments = data.segments;
      gState.itemGrams = {};
      gState.itemHidden = {};

      // Ensure plate and camera always initialize even if item rendering throws.
      drawPlate(gState.segments);
      setupDragRotation();
      setupControls();
      startCamera();

      try {
        renderItems(gState.items);
      } catch (error) {
        setStatus('AR loaded with limited details.');
      }
    })();
  </script>
</body>
</html>
