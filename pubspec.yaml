name: glucodietix
description: A Flutter app for managing diet with glucose and cholesterol tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # State Management
  provider: ^6.1.2
  
  # Image Picker
  image_picker: ^1.0.7

  # Live camera preview capture
  camera: ^0.11.0+2

  # On-device image labeling (Android/iOS) - simpler alternative
  google_mlkit_image_labeling: ^0.13.0
  
  # For future ML integration
  http: ^1.2.2
  
  # URL Launcher
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
